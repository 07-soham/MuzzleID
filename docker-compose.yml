services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: muzzleid
      POSTGRES_USER: muzzleid
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muzzleid -d muzzleid"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: muzzleid
      POSTGRES_USER: muzzleid
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      MODEL_PATH: /app/models/best_model.pt
      CALIBRATION_PATH: /app/models/calibration.json
      UPLOAD_DIR: /app/storage/uploads
      GALLERY_INDEX_PATH: /app/storage/gallery/gallery.index.enc
      MUZZLEID_OPERATOR_PASSWORD: ${MUZZLEID_OPERATOR_PASSWORD:?Set MUZZLEID_OPERATOR_PASSWORD in .env}
      MUZZLEID_SESSION_SECRET: ${MUZZLEID_SESSION_SECRET:?Set MUZZLEID_SESSION_SECRET in .env}
      MUZZLEID_DATA_KEY: ${MUZZLEID_DATA_KEY:?Set MUZZLEID_DATA_KEY in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - ./models:/app/models:ro
      - uploads:/app/storage/uploads
      - gallery:/app/storage/gallery
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/session', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
volumes:
  postgres_data:
  uploads:
  gallery:
